<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="zoom-out-template" content="4">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
  /* Layout: one column of bordered cards on near-black, in the shadcn/ui manner (thin borders, squared controls, white as the primary).
     One deliberate dark look. Status is traffic-light: red not started, amber in progress, green in three strengths for built, tested, live.
     "Blocked" is a white ring over whatever step a feature has reached. Everything is drawn from the map data at the foot of this file. */
  :root {
    color-scheme: dark;
    --bg: #050505; --card: #0c0c0c; --card-2: #161616; --fg: #fafafa; --muted: #a3a3a3; --line: #272727;
    --none: #ef4444; --prog: #f59e0b; --built: #14532d; --built-line: #22c55e; --tested: #16a34a; --live: #4ade80;
    --ring: #fafafa; --accent: #3b82f6; --last: #a78bfa; --last-bg: #2b2250; --last-fg: #ebe5ff;
    --r-card: 10px; --r-ctl: 2px;
    --body: "Geist", "Segoe UI", Arial, sans-serif;
    --mono: "Geist Mono", Consolas, "Courier New", monospace;
  }
  body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5; }
  .page {
    max-width: 1080px; margin: 0 auto; padding-block: 32px 150px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; gap: 16px;
  }
  h1, h2, h3, p, ol, ul { margin: 0; }
  ol, ul { padding: 0; list-style: none; }
  header { display: flex; flex-direction: column; gap: 12px; padding: 8px 0 12px; min-width: 0; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-card); padding: 24px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  @media (max-width: 560px) { section { padding: 16px; } }
  .eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  h1 { font-size: clamp(30px, 6vw, 46px); line-height: 1.08; font-weight: 700; letter-spacing: -.02em; text-wrap: balance; }
  h2 { font-size: 20px; line-height: 1.25; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
  h3 { font-size: 15px; font-weight: 600; }
  .about { font-size: 17px; color: var(--muted); max-width: 66ch; }
  .muted { color: var(--muted); font-size: 14px; max-width: 70ch; }
  .lead { font-size: 17px; font-weight: 600; max-width: 60ch; text-wrap: balance; }
  .facts { display: flex; flex-wrap: wrap; gap: 6px; font-family: var(--mono); font-size: 12px; }
  .facts li { border: 1px solid var(--line); border-radius: var(--r-ctl); padding: 2px 8px; color: var(--muted); background: var(--card); }
  a { color: inherit; text-underline-offset: 3px; }

  /* status */
  .s0 { --c: var(--none); --b: var(--none); --t: #ffffff; }
  .s1 { --c: var(--prog); --b: var(--prog); --t: #1a1000; }
  .s2 { --c: var(--built); --b: var(--built-line); --t: var(--fg); }
  .s3 { --c: var(--tested); --b: var(--tested); --t: #03170b; }
  .s4 { --c: var(--live); --b: var(--live); --t: #03170b; }
  .sq { width: 14px; height: 14px; border-radius: var(--r-ctl); box-sizing: border-box; flex: none; display: block; padding: 0; background: var(--c); border: 1.5px solid var(--b); transition: opacity .15s; }
  .sq.bl { box-shadow: 0 0 0 1.5px var(--bg), 0 0 0 3.5px var(--ring); }
  .sq.ring { background: transparent; border-color: var(--line); }
  .sq.lw { outline: 2px solid var(--last); outline-offset: 2px; }
  .sq.lwp { outline: 2px dashed var(--last); outline-offset: 2px; }
  .sq.lwsw { background: transparent; border: 1.5px solid var(--last); outline: 0; }
  .sq.lwsw.past { border-style: dashed; }
  .lwnote { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 24px; }
  .ini { display: flex; justify-content: center; }
  .av { display: inline-flex; align-items: center; justify-content: center; width: 23px; height: 23px; border-radius: 50%; box-sizing: border-box; flex: none;
    font-family: var(--mono); font-size: 9.5px; font-weight: 600; font-style: normal; line-height: 1; letter-spacing: 0;
    background: var(--last-bg); color: var(--last-fg); border: 1.5px solid var(--card); }
  .ini .av + .av { margin-left: -9px; }
  .trail .what { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 7px; }
  .ini:empty { display: none; }
  /* who and when: the picker at the top right */
  .bar { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 8px 14px; font-size: 13px; color: var(--muted); }
  .bar label { display: flex; align-items: center; gap: 6px; }
  .bar select, .bar input { font: inherit; font-size: 13px; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: var(--r-ctl); padding: 5px 8px; }
  .bar select:focus-visible, .bar input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .trailbox { display: flex; flex-direction: column; gap: 8px; }
  .trail { display: flex; flex-direction: column; max-height: 244px; overflow-y: auto; border-top: 1px solid var(--line); }
  .trail button { font: inherit; font-size: 13.5px; color: var(--muted); background: transparent; border: 0; border-bottom: 1px solid var(--line); text-align: left; padding: 7px 6px; cursor: pointer; display: grid; grid-template-columns: 7em minmax(0, 1fr); gap: 10px; align-items: center; }
  .trail button:hover, .trail button[aria-pressed="true"] { background: var(--card-2); color: var(--fg); }
  .trail button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .trail .d { font-family: var(--mono); font-size: 12px; }
  .trail b { color: var(--fg); font-weight: 600; }
  button.sq { cursor: pointer; }
  button.sq:hover, button.sq:focus-visible, button.sq.on { outline: 2px solid var(--accent); outline-offset: 4px; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; }
  .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: var(--r-ctl); border: 1px solid var(--line); white-space: nowrap; }
  .badge.solid { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .badge .sq { width: 9px; height: 9px; }

  /* status tiles: click one to light up every feature at that step */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(116px, 1fr)); gap: 10px; }
  .tile { font: inherit; color: inherit; text-align: left; cursor: pointer; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-card);
    padding: 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .tile:hover { background: var(--card-2); }
  .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tile[aria-pressed="true"] { border-color: var(--fg); background: var(--card-2); }
  .tile b { font-size: 30px; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .tile span { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 7px; }
  .tile .sq { width: 11px; height: 11px; }
  #app[data-f="s0"] .mark:not(.s0), #app[data-f="s1"] .mark:not(.s1), #app[data-f="s2"] .mark:not(.s2),
  #app[data-f="s3"] .mark:not(.s3), #app[data-f="s4"] .mark:not(.s4), #app[data-f="bl"] .mark:not(.bl), #app[data-f="lw"] .mark:not(.lw):not(.lwp), #app[data-f="trail"] .mark:not(.th) { opacity: .13; }

  /* the whole scope */
  .hero { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 28px; align-items: start; }
  @media (max-width: 760px) { .hero { grid-template-columns: minmax(0, 1fr); } }
  .blocks { display: flex; flex-wrap: wrap; gap: 24px 30px; }
  .blk { display: flex; flex-direction: column; gap: 9px; max-width: 160px; }
  .blk h3 { font-family: var(--mono); font-size: 11.5px; font-weight: 500; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); line-height: 1.3; overflow-wrap: anywhere; }
  .blk div { display: grid; grid-template-columns: repeat(4, 24px); gap: 8px 14px; }
  .blk .sq { width: 24px; height: 24px; }
  .panel { background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px; display: flex; flex-direction: column; gap: 8px; position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); min-height: 150px; min-width: 0; max-height: 70vh; overflow-y: auto; }
  .where { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .panel p { font-size: 14px; overflow-wrap: anywhere; }
  .who { font-size: 14px; }
  .who code { font-family: var(--mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }

  /* system diagram */
  .scroll { overflow-x: auto; }
  .dg { width: 100%; height: auto; display: block; }
  .dg text { font-family: var(--body); fill: var(--fg); }
  .dg .band { font-family: var(--mono); font-size: 11px; fill: var(--muted); letter-spacing: .08em; }
  .dg .rule { stroke: var(--line); stroke-width: 1; }
  .dg .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.5; }
  .dg .ext .box { fill: transparent; stroke-dasharray: 5 4; stroke: var(--muted); }
  .dg .node { cursor: pointer; }
  .dg .node:focus { outline: none; }
  .dg .node:hover .box, .dg .node.on .box, .dg .node:focus-visible .box { stroke: var(--fg); stroke-width: 2; }
  .dg .tt { font-size: 13px; font-weight: 600; }
  .dg .cap { font-size: 11.5px; fill: var(--muted); }
  .dg .q { fill: var(--c); stroke: var(--b); stroke-width: 1.5; transition: opacity .15s; }
  .dg .q.bl { stroke: var(--ring); stroke-width: 2.5; }
  .dg .lwr { fill: none; stroke: var(--last); stroke-width: 1.5; display: none; }
  .dg .lwr.on { display: inline; }
  .dg .lwr.past { stroke-dasharray: 3 2; }
  .dg .node.haslw .box { stroke: var(--last); }
  .dg .ln { stroke: var(--muted); stroke-width: 1.5; }
  .dg .ah { fill: var(--muted); }
  .dg .av { fill: var(--card-2); stroke: var(--line); }
  .dg .avt { fill: var(--fg); font-size: 9px; font-weight: 600; font-family: var(--mono); }
  .inline { background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-card); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
  .feat { display: flex; flex-direction: column; gap: 10px; }
  .feat li { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 2px 10px; font-size: 14px; line-height: 1.4; }
  .feat li .sq { width: 11px; height: 11px; margin-top: 4px; }
  .feat .nx { grid-column: 2; color: var(--muted); font-size: 13px; }

  /* flows */
  .flow { display: flex; flex-direction: column; gap: 10px; }
  .flow + .flow { margin-top: 14px; padding-top: 18px; border-top: 1px solid var(--line); }
  .lane { display: grid; grid-template-columns: 9em minmax(0, 1fr); gap: 4px 16px; align-items: center; }
  .lane.solo { grid-template-columns: minmax(0, 1fr); }
  .lname { font-weight: 600; font-size: 14px; line-height: 1.25; }
  .lane .reach, .lane .named { grid-column: -2 / -1; }
  @media (max-width: 560px) { .lane { grid-template-columns: minmax(0, 1fr); } }
  .segs { display: flex; gap: 3px; min-width: 0; }
  .seg { flex: 1 1 0; min-width: 0; height: 34px; border-radius: var(--r-ctl); background: var(--c); border: 1.5px solid var(--b); color: var(--t); box-sizing: border-box;
    display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .seg.bl { box-shadow: inset 0 0 0 3px var(--ring); border-color: var(--ring); }
  .brk { flex: 0 0 16px; display: flex; align-items: center; justify-content: center; font-family: var(--mono); color: var(--fg); font-weight: 500; }
  .named { display: flex; gap: 3px; }
  .named span { flex: 1 1 0; min-width: 0; font-size: 12.5px; color: var(--muted); line-height: 1.25; overflow-wrap: anywhere; }
  .named span.gap { flex: 0 0 16px; }
  @media (max-width: 640px) { .named { display: none; } }
  .reach { font-size: 14px; color: var(--muted); }
  .reach b { color: var(--fg); font-weight: 600; }
  details summary { cursor: pointer; }
  details summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .more { font-size: 13px; color: var(--muted); }
  .steps { display: flex; flex-direction: column; gap: 6px; padding: 10px 0 4px; }
  .steps li { display: grid; grid-template-columns: 1.8em minmax(0, 1fr); gap: 2px 8px; font-size: 14px; }
  .steps .n { font-family: var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }

  /* short lists: who is working, blockers, next steps */
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .col { display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--line); border-radius: var(--r-card); background: var(--bg); padding: 14px 16px; min-width: 0; }
  .col .cnt { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .col ul { display: flex; flex-direction: column; gap: 8px; padding-top: 6px; }
  .col li { font-size: 14px; color: var(--muted); line-height: 1.4; overflow-wrap: anywhere; }
  .col li strong { color: var(--fg); font-weight: 600; }
  .person { display: flex; align-items: center; gap: 10px; }
  .person i { width: 30px; height: 30px; border-radius: 50%; background: var(--card-2); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-style: normal; font-family: var(--mono); font-size: 11px; font-weight: 600; flex: none; }
  .recap { font-size: 16px; line-height: 1.6; max-width: 70ch; }
  .next { display: flex; flex-direction: column; gap: 14px; counter-reset: n; max-width: 78ch; }
  .next li { display: grid; grid-template-columns: 1.8em minmax(0, 1fr); gap: 2px 8px; counter-increment: n; }
  .next li::before { content: counter(n); font-family: var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  .next .st { font-weight: 600; }
  .next .st code { font-family: var(--mono); font-size: 12px; font-weight: 400; margin-left: 8px; padding: 2px 8px; border: 1px solid var(--line); border-radius: var(--r-ctl); background: var(--card-2); white-space: nowrap; }
  .next .wy { grid-column: 2; color: var(--muted); font-size: 14px; }
  /* things that need an answer: the item on the left, the answer box on the right */
  .acts { display: flex; flex-direction: column; }
  .act { display: grid; grid-template-columns: minmax(0, 1fr) minmax(240px, 340px); gap: 8px 24px; padding: 14px 0; border-top: 1px solid var(--line); align-items: start; }
  .acts > .act:first-child { border-top: 0; padding-top: 4px; }
  @media (max-width: 720px) { .act { grid-template-columns: minmax(0, 1fr); } }
  .act .it { display: flex; flex-direction: column; gap: 3px; min-width: 0; overflow-wrap: anywhere; }
  .act .ttl { font-weight: 600; }
  .act .ttl .n { font-family: var(--mono); color: var(--muted); font-weight: 400; margin-right: 8px; font-variant-numeric: tabular-nums; }
  .act .ttl code { font-family: var(--mono); font-size: 12px; font-weight: 400; margin-left: 8px; padding: 2px 8px; border: 1px solid var(--line); border-radius: var(--r-ctl); background: var(--card-2); white-space: nowrap; }
  .act .nt { color: var(--muted); font-size: 14px; }
  .ans { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .ans textarea, #copybox { font: inherit; font-size: 14px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-ctl); padding: 8px 10px; width: 100%; box-sizing: border-box; min-height: 38px; resize: vertical; }
  .ans textarea:focus-visible, #copybox:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .ans textarea.has { border-color: var(--fg); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip, .btn { font: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: var(--r-ctl); padding: 3px 9px; }
  .chip:hover { background: var(--card-2); }
  .chip:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn { font-size: 14px; font-weight: 600; padding: 8px 16px; background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); font-weight: 500; }
  .btn:disabled { opacity: .4; cursor: default; }
  .grp { border-top: 1px solid var(--line); padding-top: 12px; }
  .grp .cnt { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-left: 8px; }
  .grp .acts { padding-top: 6px; }
  .outlist { display: flex; flex-direction: column; gap: 10px; }
  .outlist li { font-size: 14px; color: var(--muted); max-width: 80ch; overflow-wrap: anywhere; }
  .outlist li strong { color: var(--fg); font-weight: 600; display: block; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  /* map age, progress by area, progress over time, board */
  .banner { border: 1px solid var(--prog); border-radius: var(--r-card); background: var(--card); padding: 12px 16px; font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
  .banner span { color: var(--muted); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .legend .sq { width: 11px; height: 11px; }
  .areas { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .area { background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-card); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .area h3 { font-size: 13.5px; overflow-wrap: anywhere; }
  .area .pct { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 7px; }
  .area .pct b { font-size: 22px; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .area .pct span { font-size: 12px; color: var(--muted); }
  .lbar { display: flex; gap: 2px; height: 8px; }
  .lbar i { display: block; height: 100%; min-width: 3px; background: var(--c); box-shadow: inset 0 0 0 1px var(--b); border-radius: 1px; }
  .hist { width: 100%; height: auto; display: block; max-width: 760px; }
  .hist text { font-family: var(--mono); font-size: 11px; fill: var(--muted); }
  .hist .grid { stroke: var(--line); stroke-width: 1; }
  .hist .c { fill: var(--c); stroke: var(--b); stroke-width: 1; }
  .hist .hit { fill: transparent; cursor: default; }
  .hist .hit:hover, .hist .hit:focus-visible { fill: rgba(255, 255, 255, .07); outline: none; }
  .histread { font-size: 13.5px; color: var(--muted); min-height: 1.5em; }
  .histread strong { color: var(--fg); font-weight: 600; }
  .tbl { border-collapse: collapse; font-size: 13px; margin-top: 8px; }
  .tbl th, .tbl td { padding: 4px 12px 4px 0; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tbl th { font-weight: 500; color: var(--muted); }
  .tbl th:first-child, .tbl td:first-child { text-align: left; }
  .board { display: grid; grid-template-columns: repeat(var(--n), minmax(176px, 1fr)); gap: 10px; align-items: start; }
  .lcol { background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-card); display: flex; flex-direction: column; min-width: 0; }
  .colh { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 13px; font-weight: 600; }
  .colh span { display: flex; align-items: center; gap: 7px; }
  .colh .sq { width: 11px; height: 11px; }
  .colh b { font-family: var(--mono); font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
  .cards { display: flex; flex-direction: column; gap: 6px; padding: 8px; max-height: 440px; overflow-y: auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-ctl); padding: 8px 10px; transition: opacity .15s; min-width: 0; }
  .card summary { list-style: none; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  .card summary::-webkit-details-marker { display: none; }
  .card .ct { font-size: 13.5px; font-weight: 500; line-height: 1.3; overflow-wrap: anywhere; }
  .card[open] { border-color: var(--muted); }
  .card .badge { white-space: normal; }
  .card .cb { display: flex; flex-direction: column; gap: 6px; padding-top: 8px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .pr { margin-top: 6px; }
  .pr pre { font-family: var(--mono); font-size: 12.5px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; margin: 8px 0; padding: 10px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-ctl); max-height: 280px; overflow-y: auto; }
  .plain { display: flex; flex-direction: column; gap: 7px; }
  .plain li { font-size: 14px; color: var(--muted); max-width: 72ch; }
  .plain li strong { color: var(--fg); font-weight: 600; }
  .aside { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  footer { padding: 16px 4px 0; display: flex; flex-direction: column; gap: 8px; }
  [hidden] { display: none !important; }

  /* --- navigation: one view at a time. The dock switches views; the circle menu jumps between a view's sections. --- */
  .view { display: flex; flex-direction: column; gap: 16px; animation: viewin .28s ease both; }
  @keyframes viewin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  #app:not([data-view="overview"]) .about, #app:not([data-view="overview"]) .facts { display: none; }
  #app:not([data-view="overview"]) header { padding: 0; }

  .dockwrap { position: fixed; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 30; display: flex; justify-content: center; pointer-events: none;
    padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
  .dock { --size: 48px; pointer-events: auto; display: inline-flex; align-items: flex-end; gap: 8px; padding: 10px; border-radius: 24px;
    background: rgba(23, 23, 23, .8); -webkit-backdrop-filter: blur(20px) saturate(1.5); backdrop-filter: blur(20px) saturate(1.5);
    border: 1px solid #404040; box-shadow: 0 20px 40px rgba(0, 0, 0, .45); animation: dockin .5s cubic-bezier(.25, .46, .45, .94) both; }
  @keyframes dockin { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
  .di { --s: 1; position: relative; flex: none; width: calc(var(--size) * var(--s)); height: calc(var(--size) * var(--s)); padding: 0; border: 0; background: transparent; color: #fff; cursor: pointer;
    border-radius: 16px; transform: translateY(calc((var(--s) - 1) * -10px)); transition: width .14s cubic-bezier(.2, .8, .3, 1.25), height .14s cubic-bezier(.2, .8, .3, 1.25), transform .14s cubic-bezier(.2, .8, .3, 1.25); }
  .di:focus-visible { outline: 2px solid rgba(255, 255, 255, .6); outline-offset: 3px; }
  .dic { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(#262626, #171717); border: 1px solid #404040;
    box-shadow: 0 4px 12px rgba(0, 0, 0, .3), inset 0 1px 0 rgba(255, 255, 255, .18); transition: box-shadow .2s, transform .1s; }
  .dic::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(135deg, rgba(255, 255, 255, .17) 0%, transparent 50%); opacity: .55; transition: opacity .2s; }
  .di:hover .dic { box-shadow: 0 8px 32px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .3), 0 0 30px rgba(255, 255, 255, .12); }
  .di:hover .dic::after { opacity: 1; }
  .di:active .dic { transform: scale(.9); }
  .dic svg { width: 54%; height: 54%; }
  .ddot { position: absolute; left: 50%; bottom: -8px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: rgba(255, 255, 255, .85); transform: scale(0); transition: transform .2s; }
  .di[aria-current="page"] .ddot { transform: scale(1); }
  .di[aria-current="page"] .dic { border-color: #737373; }
  .dbadge { position: absolute; top: -5px; right: -5px; min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 999px; background: #ef4444; color: #fff;
    font: 600 11px/16px var(--body); border: 2px solid #0a0a0a; display: flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }
  .dtip { position: absolute; bottom: calc(100% + 12px); left: 50%; transform: translate(-50%, 8px) scale(.9); opacity: 0; pointer-events: none; padding: 6px 12px; border-radius: 8px;
    background: rgba(23, 23, 23, .96); border: 1px solid rgba(255, 255, 255, .1); color: #fff; font: 500 13px var(--body); white-space: nowrap; box-shadow: 0 12px 24px rgba(0, 0, 0, .3); transition: opacity .15s ease-out, transform .15s ease-out; }
  .dtip::after { content: ""; position: absolute; left: 50%; bottom: -5px; width: 8px; height: 8px; margin-left: -4px; transform: rotate(45deg); background: inherit; border-right: 1px solid rgba(255, 255, 255, .1); border-bottom: 1px solid rgba(255, 255, 255, .1); }
  .di:hover .dtip, .di:focus-visible .dtip { opacity: 1; transform: translate(-50%, 0) scale(1); }
  @media (max-width: 520px) { .dock { --size: 39px; gap: 6px; padding: 8px; border-radius: 20px; } .di { border-radius: 13px; } }

  .cmback { position: fixed; inset: 0; z-index: 35; background: rgba(0, 0, 0, .74); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); opacity: 0; pointer-events: none; transition: opacity .25s; }
  .cmback.on { opacity: 1; pointer-events: auto; }
  .cm { position: fixed; right: max(24px, env(safe-area-inset-right, 0px)); bottom: calc(26px + env(safe-area-inset-bottom, 0px)); width: 48px; height: 48px; z-index: 40; transition: transform .42s cubic-bezier(.3, 1.3, .5, 1); }
  @media (max-width: 640px) { .cm { bottom: calc(86px + env(safe-area-inset-bottom, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); } }
  .cmt { position: absolute; inset: 0; z-index: 2; border: 0; border-radius: 50%; background: var(--fg); color: var(--bg); cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .5); transition: filter .1s, transform .15s; }
  .cmt:hover { filter: brightness(1.12); }
  .cmt:active { transform: scale(.92); }
  .cmt:focus-visible, .cmi:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .cmt svg { position: absolute; width: 18px; height: 18px; transition: opacity .2s, filter .2s; }
  .cmt .i-close, .cm.open .cmt .i-open { opacity: 0; filter: blur(10px); }
  .cm.open .cmt .i-close { opacity: 1; filter: none; }
  .cm.closing .cmt { animation: cmshake .07s linear infinite; }
  @keyframes cmshake { 0%, 100% { translate: 0; } 33% { translate: 2px; } 66% { translate: -2px; } }
  .cmring { position: absolute; inset: 0; z-index: 1; }
  .cm.closing .cmring { transform: rotate(-360deg); filter: blur(1px); transition: transform var(--spin, .5s) linear; }
  .cmi { position: absolute; left: 1px; top: 1px; width: 46px; height: 46px; padding: 0; border: 0; border-radius: 50%; background: #262626; color: var(--fg); cursor: pointer; display: flex; align-items: center; justify-content: center;
    transform: translate(0, 0) scale(.5); opacity: 0; pointer-events: none; transition: transform .38s cubic-bezier(.3, 1.25, .5, 1), opacity .2s, background .15s; transition-delay: calc(var(--i) * 70ms); }
  .cm.open .cmi { transform: translate(var(--x), var(--y)) scale(1); opacity: 1; pointer-events: auto; transition-delay: calc(var(--i) * 20ms); }
  .cmi:hover { background: #3d3d3d; }
  .cmi svg { width: 17px; height: 17px; }
  .cmi .l { position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(-50%); font: 500 12px var(--body); color: var(--fg); white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) { .sq, .dg .q, .di, .cm, .cmi { transition: none; } .view, .dock, .cm.closing .cmt { animation: none; } .cm.closing .cmring { transform: none; filter: none; } }
</style>

<div id="app"></div>
<script id="map-data" type="application/json">__MAP_JSON__</script>
<script>
const M = JSON.parse(document.getElementById('map-data').textContent);
const ORDER = ['none', 'progress', 'built', 'tested', 'live'];
const LBL = { none: 'Not started', progress: 'In progress', built: 'Built', tested: 'Works in testing', live: 'Proven live' };
const BK = { decision: 'Waiting on a decision', off: 'Switched off', build: 'Needs something not built yet' };
const LADDER = M.hasLive === false ? ORDER.slice(0, 4) : ORDER;

const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const day = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); return m ? `${+m[3]} ${['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][+m[2] - 1]} ${m[1]}` : esc(iso || ''); };
const si = f => Math.max(0, ORDER.indexOf(f.status));
const init = n => String(n).split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
const F = M.features || [], BY = {}, PB = {};
const PARTS = (M.parts || []).slice().sort((a, b) => a.band - b.band || a.col - b.col);
PARTS.forEach(p => { PB[p.id] = p; p.fs = []; });
F.forEach(f => { BY[f.id] = f; if (PB[f.part]) PB[f.part].fs.push(f); });
/* who worked where: VIEW.who is a name, '*' for everyone or '' for nobody; the sets are filled by paintPeople() */
const PEOPLE = (M.people || []).filter(p => p && p.name);
const VIEW = { who: '', mode: '30', from: '', to: '' };
let NOW = new Set(), PAST = new Set(), WHOS = {}, TRAIL = [];
const count = s => F.filter(f => f.status === s).length;
const blocked = F.filter(f => f.blocked);
const working = F.filter(f => f.work && f.work.who && f.status === 'progress');
const assigned = F.filter(f => f.work && f.work.who);

const cls = f => `s${si(f)}${f.blocked ? ' bl' : ''}`;
const label = f => `${f.title}. ${LBL[f.status]}${f.blocked ? ', blocked' : ''}`;
const sqBtn = f => `<span class="cell"><button class="sq mark ${cls(f)}" data-k="${esc(f.id)}" title="${esc(label(f))}" aria-label="${esc(label(f))}"></button><small class="ini" data-i="${esc(f.id)}"></small></span>`;
const sqI = f => `<i class="sq ${cls(f)}"></i>`;
const badges = f => `<span class="badges"><span class="badge"><i class="sq s${si(f)}"></i>${LBL[f.status]}</span>${f.blocked ? `<span class="badge solid">${BK[f.blocked.kind] || 'Blocked'}</span>` : ''}</span>`;
const who = f => { const w = f.work; if (!w || !w.who) return '';
  const t = w.ticket ? (w.url ? `<a href="${esc(w.url)}">${esc(w.ticket)}</a>` : esc(w.ticket)) : '';
  return `<span class="who"><strong>${esc(w.who)}</strong>${t ? ' · ' + t : ''}${w.branch ? ` · <code>${esc(w.branch)}</code>` : ''}</span>`; };

function detail(f) {
  if (!f) return `<p class="where">Detail</p><p class="muted">Pick a square to see what it is and where it stands. Pick a count above to light up every feature at that step.</p>`;
  const p = PB[f.part];
  return `<p class="where">${esc(p ? p.title : '')}</p><h3>${esc(f.title)}</h3>${badges(f)}
    ${f.blocked && f.blocked.note ? `<p>${esc(f.blocked.note)}</p>` : ''}
    <p>${esc(f.evidence || (f.status === 'none' ? 'Nothing exists yet.' : ''))}</p>
    ${f.next ? `<p><strong>Next:</strong> ${esc(f.next)}</p>` : ''}${who(f)}
    ${WHOS[f.id] ? `<p class="where" style="color:var(--last)">${NOW.has(f.id) ? 'Being worked on by' : 'Worked on by'} ${esc(WHOS[f.id].join(', '))}</p>` : ''}
    ${f.source ? `<p class="where">Promised in: ${esc(f.source)}</p>` : ''}
    <p class="where">${f.checked === M.updated ? 'Checked ' + day(f.checked) : 'Not rechecked since ' + day(f.checked)}</p>`;
}
function listFor(key) {
  const fs = key === 'bl' ? blocked : key === 'lw' ? F.filter(f => NOW.has(f.id) || PAST.has(f.id)) : F.filter(f => 's' + si(f) === key);
  const name = key === 'bl' ? 'Blocked' : key === 'lw' ? 'Worked on' : LBL[ORDER[+key.slice(1)]];
  return `<p class="where">${fs.length} ${fs.length === 1 ? 'feature' : 'features'}</p><h3>${name}</h3>
    <ul class="feat">${fs.map(f => `<li>${sqI(f)}<span>${esc(f.title)}</span><span class="nx">${esc(PB[f.part] ? PB[f.part].title : '')}${key === 'bl' ? ' · ' + (BK[f.blocked.kind] || 'Blocked') : ''}${key === 'lw' && WHOS[f.id] ? ' · ' + esc(WHOS[f.id].join(', ')) + (NOW.has(f.id) ? ' (now)' : '') : ''}</span></li>`).join('')}</ul>`;
}
function partDetail(id) {
  const p = PB[id];
  if (!p) return `<p class="muted">Pick a box to see its features and who is on them.</p>`;
  return `<p class="where">${esc((M.bands || [])[p.band] || '')}</p><h3>${esc(p.title)}</h3>${p.note ? `<p>${esc(p.note)}</p>` : ''}
    <ul class="feat">${p.fs.map(f => `<li>${sqI(f)}<span>${esc(f.title)}</span><span class="nx">${LBL[f.status]}${f.blocked ? ' · ' + (BK[f.blocked.kind] || 'Blocked') : ''}${who(f) ? ' · ' + who(f) : ''}</span></li>`).join('')}</ul>`;
}

/* flows: a step is as far along as its least-proven feature */
function laneSteps(flow, lane) {
  return (flow.steps || []).map((st, i) => {
    const fs = Array.isArray(st.features) ? st.features : lane ? st.features[lane] : [].concat(...Object.values(st.features || {}));
    return { n: i + 1, t: st.title, fs: (fs || []).map(k => BY[k]).filter(Boolean) };
  }).filter(x => x.fs.length).map(x => {
    const low = x.fs.reduce((a, f) => si(f) < si(a) ? f : a), bl = x.fs.find(f => f.blocked);
    return { n: x.n, t: x.t, s: si(low), bl, why: bl ? `${BK[bl.blocked.kind] || 'Blocked'}: ${bl.title}` : (si(low) < 3 ? `${LBL[low.status]}: ${low.title}` : '') };
  });
}
function lane(flow, name) {
  const st = laneSteps(flow, name);
  if (!st.length) return '';
  let cut = st.findIndex(x => x.s < 3 || x.bl); if (cut < 0) cut = st.length;
  const track = `<div class="segs">${st.map((x, i) => `${i === cut ? '<div class="brk" aria-hidden="true">//</div>' : ''}<div class="seg s${x.s}${x.bl ? ' bl' : ''}" title="${esc(x.t + '. ' + LBL[ORDER[x.s]])}"><span>${x.n}</span></div>`).join('')}</div>`;
  const reach = cut >= st.length ? '<b>Works end to end in testing.</b>'
    : `<b>${cut ? `Works in testing up to step ${st[cut - 1].n}.` : 'Does not get past the first step.'}</b> Stops at "${esc(st[cut].t)}". ${esc(st[cut].why)}.`;
  const named = name ? '' : `<div class="named">${st.map((x, i) => `${i === cut ? '<span class="gap"></span>' : ''}<span>${esc(x.t)}</span>`).join('')}</div>`;
  return `<div class="lane${name ? '' : ' solo'}">${name ? `<div class="lname">${esc(name)}</div>` : ''}${track}${named}<p class="reach">${reach}</p></div>`;
}
const flowHtml = fl => `<div class="flow"><h3>${esc(fl.title)}</h3>${(fl.lanes && fl.lanes.length ? fl.lanes : [null]).map(n => lane(fl, n)).join('')}
  <details><summary class="more">The ${fl.steps.length} steps</summary><ol class="steps">${fl.steps.map((s, i) => `<li><span class="n">${i + 1}</span><span>${esc(s.title)}</span></li>`).join('')}</ol></details></div>`;

/* diagram: boxes sit in a band (row) and a column; arrows run centre to centre, clipped at the box edges */
function diagram() {
  const W = 156, GX = 28, PITCH = W + GX, PAD = 8, PER = 9;
  const bands = M.bands || [], cols = Math.max(1, ...PARTS.map(p => p.col + 1));
  const hOf = p => 30 + Math.ceil(p.fs.length / PER) * 14 + 32;
  const pos = {}; let y = 0; const rows = [];
  bands.forEach((b, bi) => {
    const ps = PARTS.filter(p => p.band === bi); if (!ps.length) return;
    const h = Math.max(78, ...ps.map(hOf));
    rows.push({ b, y });
    ps.forEach(p => pos[p.id] = { x: PAD + p.col * PITCH, y: y + 24, w: W, h });
    y += 24 + h + 30;
  });
  const width = PAD * 2 + cols * PITCH - GX, height = y - 14;
  const edge = (r, tx, ty) => { const cx = r.x + r.w / 2, cy = r.y + r.h / 2, dx = tx - cx, dy = ty - cy;
    const t = Math.min(dx ? (r.w / 2) / Math.abs(dx) : Infinity, dy ? (r.h / 2) / Math.abs(dy) : Infinity); return [cx + dx * t, cy + dy * t]; };
  const lines = (M.links || []).map(([a, b]) => {
    const A = pos[a], B = pos[b]; if (!A || !B) return '';
    const [x1, y1] = edge(A, B.x + B.w / 2, B.y + B.h / 2), [ex, ey] = edge(B, A.x + A.w / 2, A.y + A.h / 2);
    const len = Math.hypot(ex - x1, ey - y1) || 1, x2 = ex - (ex - x1) / len * 3, y2 = ey - (ey - y1) / len * 3;
    return `<line class="ln" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" marker-end="url(#arr)"/>`;
  }).join('');
  const nodes = PARTS.filter(p => pos[p.id]).map(p => {
    const r = pos[p.id], ppl = [...new Set(p.fs.filter(f => f.work && f.work.who).map(f => f.work.who))].slice(0, 3);
    const title = p.title.length > 21 ? p.title.slice(0, 20) + '…' : p.title;
    return `<g class="node${p.external ? ' ext' : ''}" data-p="${esc(p.id)}" tabindex="0" role="button" aria-label="${esc(p.title)}" transform="translate(${r.x},${r.y})">
      <title>${esc(p.title)}</title><rect class="box" width="${r.w}" height="${r.h}" rx="6"/><text class="tt" x="10" y="21">${esc(title)}</text>
      ${p.fs.map((f, i) => `<rect class="lwr" data-r="${esc(f.id)}" x="${7 + (i % PER) * 14}" y="${30 + Math.floor(i / PER) * 14}" width="17" height="17" rx="3"/>`).join('')}
      ${p.fs.map((f, i) => `<rect class="q mark ${cls(f)}" data-k="${esc(f.id)}" x="${10 + (i % PER) * 14}" y="${33 + Math.floor(i / PER) * 14}" width="11" height="11" rx="1.5"/>`).join('')}
      <text class="cap" x="10" y="${r.h - 14}">${p.external ? 'Outside service' : p.fs.length + (p.fs.length === 1 ? ' feature' : ' features')}</text>
      ${ppl.map((n, i) => `<circle class="av" cx="${r.w - 16 - i * 22}" cy="${r.h - 18}" r="10"/><text class="avt" x="${r.w - 16 - i * 22}" y="${r.h - 15}" text-anchor="middle">${esc(init(n))}</text>`).join('')}</g>`;
  }).join('');
  return `<div class="scroll"><svg class="dg" style="min-width:${Math.min(width, cols * 128)}px;max-width:${Math.round(width * 1.35)}px" viewBox="0 0 ${width} ${height}" role="group" aria-label="System diagram">
    <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs>
    ${rows.map((r, i) => `${i ? `<line class="rule" x1="0" x2="${width}" y1="${r.y - 10}" y2="${r.y - 10}"/>` : ''}<text class="band" x="${PAD}" y="${r.y + 12}">${esc(String(r.b).toUpperCase())}</text>`).join('')}${lines}${nodes}</svg></div>`;
}

/* every item that needs an answer gets a box; ITEMS keeps them in page order for the copy text */
const ITEMS = [];
const CHIPS = { block: ['Unblocked now', 'Still blocked'], q: ['Yes', 'No'], next: ['Go', 'Not now'], pending: ['Add it', 'Leave it out'] };
function act(type, id, kind, title, note, extra) {
  const key = (type + '-' + id).replace(/[^A-Za-z0-9_-]/g, '-');
  ITEMS.push({ key, kind, title, note, ref: type === 'block' ? id : '' });
  return `<li class="act"><div class="it"><span class="ttl">${extra && extra.n ? `<span class="n">${extra.n}</span>` : ''}${esc(title)}${extra && extra.skill ? `<code>${esc(extra.skill)}</code>` : ''}</span>${note ? `<span class="nt">${esc(note)}</span>` : ''}${extra && extra.since && extra.since !== M.updated ? `<span class="where">Open since ${day(extra.since)}</span>` : ''}${extra && extra.prompt ? `<details class="pr"><summary class="more">Prompt for an agent</summary><pre>${esc(extra.prompt)}</pre><button class="chip" type="button" data-copy>Copy prompt</button></details>` : ''}</div>
    <div class="ans"><textarea id="a-${key}" data-a="${key}" rows="1" placeholder="Your answer" aria-label="Your answer: ${esc(title)}"></textarea><div class="chips">${CHIPS[type].map(c => `<button class="chip" type="button" data-fill="${key}">${c}</button>`).join('')}</div></div></li>`;
}

/* --- HQ additions: map age, progress by area, progress over time, board. All computed from the map. --- */
const HIST = (M._history || []).filter(h => h && h.date && h.counts);
const BARORDER = LADDER.slice().reverse();
const legend = () => `<p class="legend">${BARORDER.map(s => `<span><i class="sq s${ORDER.indexOf(s)}"></i>${LBL[s]}</span>`).join('')}</p>`;
function ageBanner() {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(M.updated || ''); if (!m) return '';
  const days = Math.floor((Date.now() - Date.UTC(+m[1], +m[2] - 1, +m[3])) / 864e5);
  return days > 3 ? `<div class="banner" role="status"><strong>This map is ${days} days old.</strong><span>It was last refreshed on ${day(M.updated)}. The code and the tracker may have moved since. Run /zoom-out in the project to refresh it.</span></div>` : '';
}
function lbar(fs) {
  return `<div class="lbar" role="img" aria-label="${esc(BARORDER.map(s => fs.filter(f => f.status === s).length + ' ' + LBL[s].toLowerCase()).join(', '))}">${BARORDER.map(s => { const n = fs.filter(f => f.status === s).length; return n ? `<i class="s${ORDER.indexOf(s)}" style="flex:${n}" title="${n} ${LBL[s].toLowerCase()}"></i>` : ''; }).join('')}</div>`;
}
function areas() {
  const what = M.hasLive === false ? 'working in testing' : 'tested or live';
  return `<div class="areas">${PARTS.filter(p => p.fs.length).map(p => { const done = p.fs.filter(f => si(f) >= 3).length;

}
const histRead = i => { const h = HIST[i]; return `<strong>${day(h.date)}</strong> · ${h.total} features · ${BARORDER.map(s => `${h.counts[s] || 0} ${LBL[s].toLowerCase()}`).join(', ')}${h.blocked ? ` · ${h.blocked} blocked` : ''}`; };
function histChart() {
  const W = 720, H = 230, L = 34, R = 8, T = 10, B = 26, pw = W - L - R, ph = H - T - B, n = HIST.length;
  const top = Math.max(1, ...HIST.map(h => h.total)), step = Math.max(1, Math.ceil(top / 4)), max = step * 4;
  const band = pw / n, bw = Math.min(46, band * 0.7), y = v => T + ph - v / max * ph, every = Math.ceil(n / 8);
  const short = d => day(d).replace(/ \d{4}$/, '');
  const cols = HIST.map((h, i) => { let acc = 0; const x = L + band * i + (band - bw) / 2;
    const segs = BARORDER.map(s => { const v = h.counts[s] || 0; if (!v) return ''; const y1 = y(acc + v), hh = y(acc) - y1; acc += v;
      return `<rect class="c s${ORDER.indexOf(s)}" x="${x}" y="${y1 + (hh > 4 ? 1 : 0)}" width="${bw}" height="${Math.max(1, hh - (hh > 4 ? 2 : 0))}" rx="1.5"/>`; }).join('');
    const lab = (i % every === 0 || i === n - 1) && !(i !== n - 1 && n - 1 - i < every) ? `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${short(h.date)}</text>` : '';
    return `${segs}${lab}<rect class="hit" data-h="${i}" tabindex="0" role="img" aria-label="${esc(histRead(i).replace(/<[^>]+>/g, ''))}" x="${L + band * i}" y="${T}" width="${band}" height="${ph}"/>`; }).join('');
  const grid = [0, 1, 2, 3, 4].map(k => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(k * step)}" y2="${y(k * step)}"/><text x="${L - 6}" y="${y(k * step) + 4}" text-anchor="end">${k * step}</text>`).join('');
  return `${legend()}<svg class="hist" viewBox="0 0 ${W} ${H}" role="group" aria-label="Features at each step of the ladder, at each refresh">${grid}${cols}</svg>
    <p class="histread" id="histread">${histRead(n - 1)}</p>${n === 1 ? '<p class="muted">One refresh so far. A column is added each time the map is refreshed.</p>' : ''}
    <details><summary class="more">Show as a table</summary><div class="scroll"><table class="tbl"><thead><tr><th>Refresh</th>${BARORDER.map(s => `<th>${LBL[s]}</th>`).join('')}<th>Total</th><th>Blocked</th></tr></thead><tbody>${HIST.slice().reverse().map(h => `<tr><td>${day(h.date)}</td>${BARORDER.map(s => `<td>${h.counts[s] || 0}</td>`).join('')}<td>${h.total}</td><td>${h.blocked || 0}</td></tr>`).join('')}</tbody></table></div></details>`;
}
const card = f => `<details class="card mark ${cls(f)}" data-k="${esc(f.id)}"><summary><span class="ct">${esc(f.title)}</span><span class="where">${esc(PB[f.part] ? PB[f.part].title : '')}${f.work && f.work.who ? ' · ' + esc(f.work.who) : ''}</span>${f.blocked ? `<span class="badge solid">${BK[f.blocked.kind] || 'Blocked'}</span>` : ''}</summary>

function board() {

}

const app = document.getElementById('app');

function pickPart(n) {

}
function inRange(d) {
  if (VIEW.mode === 'all') return true;
  if (VIEW.mode === 'custom') return (!VIEW.from || d >= VIEW.from) && (!VIEW.to || d <= VIEW.to);
  const t = new Date(M.updated + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() - 30);
  return d >= t.toISOString().slice(0, 10);
}
function clearTrail() {
  app.querySelectorAll('.trail button').forEach(b => b.setAttribute('aria-pressed', 'false'));
  if (app.dataset.f === 'trail') delete app.dataset.f;
}
/* rings, initials, the trail list and the "worked on" count all follow the picker */
function paintPeople() {
  if (!PEOPLE.length) return;
  const sel = VIEW.who === '*' ? PEOPLE : PEOPLE.filter(p => p.name === VIEW.who), who = {};
  NOW = new Set(); PAST = new Set(); TRAIL = [];
  const note = (id, name) => (who[id] = who[id] || new Set()).add(name);
  sel.forEach(p => {
    (p.now || []).forEach(id => { NOW.add(id); note(id, p.name); });
    (p.trail || []).filter(t => inRange(t.date)).forEach(t => { TRAIL.push({ name: p.name, t }); (t.features || []).forEach(id => { PAST.add(id); note(id, p.name); }); });
  });
  NOW.forEach(id => PAST.delete(id));
  WHOS = {}; Object.keys(who).forEach(k => { WHOS[k] = [...who[k]]; });
  TRAIL.sort((a, b) => a.t.date < b.t.date ? 1 : a.t.date > b.t.date ? -1 : 0);
  app.querySelectorAll('.mark').forEach(m => { m.classList.toggle('lw', NOW.has(m.dataset.k)); m.classList.toggle('lwp', PAST.has(m.dataset.k)); m.classList.remove('th'); });
  app.querySelectorAll('.ini').forEach(el => {
    const w = VIEW.who === '*' ? (WHOS[el.dataset.i] || []) : [];
    const shown = w.length > 2 ? [init(w[0]), '+' + (w.length - 1)] : w.map(init);
    el.innerHTML = shown.map(t => `<i class="av">${esc(t)}</i>`).join('');
    el.title = w.join(', ');
  });
  app.querySelectorAll('.lwr').forEach(r => { r.classList.toggle('on', NOW.has(r.dataset.r) || PAST.has(r.dataset.r)); r.classList.toggle('past', PAST.has(r.dataset.r)); });
  app.querySelectorAll('.node').forEach(n => n.classList.toggle('haslw', PB[n.dataset.p].fs.some(f => NOW.has(f.id) || PAST.has(f.id))));
  app.querySelector('.tile[data-f="lw"] b').textContent = NOW.size + PAST.size;
  const period = VIEW.mode === 'all' ? 'the whole project' : VIEW.mode === 'custom' ? `${VIEW.from ? day(VIEW.from) : 'the start'} to ${VIEW.to ? day(VIEW.to) : 'today'}` : 'the last 30 days';
  const name = VIEW.who === '*' ? 'Everyone' : VIEW.who;
  document.getElementById('lwnote').hidden = document.getElementById('trailbox').hidden = !VIEW.who;
  document.getElementById('lwwho').textContent = VIEW.who === '*' ? '· initials show who · ' + period : `· ${name} · ${period}`;
  document.getElementById('trailh').textContent = `Work trail: ${name}, ${period}`;
  document.getElementById('trail').innerHTML = TRAIL.length ? TRAIL.map((r, i) => `<button type="button" data-t="${i}" aria-pressed="false"><span class="d">${day(r.t.date)}</span><span class="what">${VIEW.who === '*' ? `<i class="av">${esc(init(r.name))}</i><b>${esc(r.name)}</b> ` : ''}${esc(r.t.summary || '')}</span></button>`).join('') : '<p class="muted" style="padding:8px 6px">No work recorded in this period.</p>';
  clearTrail();
  if (app.dataset.f === 'lw') app.querySelector('[data-detail]').innerHTML = listFor('lw');
}
function setFilter(key) {
  clearTrail();
  if (app.dataset.f === key) key = '';
  if (key) app.dataset.f = key; else delete app.dataset.f;
  app.querySelectorAll('.tile').forEach(t => t.setAttribute('aria-pressed', String(!!key && t.dataset.f === key)));
  app.querySelectorAll('button.sq.on').forEach(x => x.classList.remove('on'));
  app.querySelector('[data-detail]').innerHTML = key ? listFor(key) : detail();
}
/* answers: kept in this browser between visits to the same map, gathered into one text to copy */
const STORE = 'zoom-out:' + M.project + ':' + M.updated;
const box = key => document.getElementById('a-' + key);
function answersText() {
  const done = ITEMS.filter(it => box(it.key) && box(it.key).value.trim());
  return [`Answers for /zoom-out · ${M.project} · map of ${M.updated}`, '',
    ...done.map(it => `${it.kind}: ${it.title}${it.ref ? ` [${it.ref}]` : ''}\n${it.note ? `Context: ${it.note}\n` : ''}Answer: ${box(it.key).value.trim()}\n`)].join('\n');
}
function syncAnswers(save) {
  const out = document.getElementById('outlist'); if (!out) return;
  const done = ITEMS.filter(it => box(it.key).value.trim()), vals = {};
  ITEMS.forEach(it => { const b = box(it.key); b.classList.toggle('has', !!b.value.trim()); if (b.value.trim()) vals[it.key] = b.value; });
  out.innerHTML = done.length ? done.map(it => `<li><strong>${esc(it.kind)}: ${esc(it.title)}</strong>${esc(box(it.key).value.trim())}</li>`).join('') : '<li>Nothing answered yet.</li>';
  document.getElementById('copy').disabled = document.getElementById('clear').disabled = !done.length;
  document.getElementById('copy').textContent = done.length ? `Copy ${done.length} ${done.length === 1 ? 'answer' : 'answers'}` : 'Copy answers';
  document.getElementById('prog').textContent = `${done.length} of ${ITEMS.length} answered`;
  document.getElementById('copied').textContent = '';
  document.getElementById('copybox').hidden = true;
  if (save) { try { localStorage.setItem(STORE, JSON.stringify(vals)); } catch (e) { /* answers still work without storage */ } }
}
if (ITEMS.length) {
  try { const saved = JSON.parse(localStorage.getItem(STORE) || '{}'); ITEMS.forEach(it => { if (saved[it.key]) box(it.key).value = saved[it.key]; }); } catch (e) { /* start empty */ }
  syncAnswers(false);
  app.addEventListener('input', e => { if (e.target.matches('textarea[data-a]')) syncAnswers(true); });
}
function copyAnswers() {
  const text = answersText(), note = document.getElementById('copied'), cb = document.getElementById('copybox');
  const fallback = () => { cb.value = text; cb.hidden = false; cb.focus(); cb.select(); note.textContent = 'Select the text below and copy it.'; };
  try { navigator.clipboard.writeText(text).then(() => { note.textContent = 'Copied. Paste it to your agent.'; }, fallback); } catch (e) { fallback(); }
}

app.addEventListener('click', e => {
  const chip = e.target.closest('.chip[data-fill]');
  if (chip) { const b = box(chip.dataset.fill); b.value = chip.textContent; b.focus(); return syncAnswers(true); }
  if (e.target.closest('#copy')) return copyAnswers();
  if (e.target.closest('#clear')) { ITEMS.forEach(it => { box(it.key).value = ''; }); return syncAnswers(true); }
  const tb = e.target.closest('.trail button');
  if (tb) {
    const on = tb.getAttribute('aria-pressed') === 'true';
    setFilter('');
    if (!on) {
      const ids = new Set(TRAIL[+tb.dataset.t].t.features || []);
      app.querySelectorAll('.mark').forEach(m => m.classList.toggle('th', ids.has(m.dataset.k)));
      app.dataset.f = 'trail'; tb.setAttribute('aria-pressed', 'true');
    }
    return;
  }
  const t = e.target.closest('.tile');
  if (t) { if (t.dataset.f && !MARKVIEWS.includes(app.dataset.view)) go('scope', true); return setFilter(t.dataset.f); }
  const n = e.target.closest('.node[data-p]');
  if (n) return pickPart(n);
  const b = e.target.closest('button.sq[data-k]'); if (!b) return;
  app.querySelectorAll('button.sq.on').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  app.querySelector('[data-detail]').innerHTML = detail(BY[b.dataset.k]);
});
app.addEventListener('keydown', e => {
  const n = e.target.closest('.node[data-p]');

/* progress over time: hovering or tabbing to a column reads it out; next-step prompts copy on click */
const readCol = e => { const h = e.target.closest && e.target.closest('.hit[data-h]'); if (h) document.getElementById('histread').innerHTML = histRead(+h.dataset.h); };
app.addEventListener('mouseover', readCol);
app.addEventListener('focusin', readCol);
app.addEventListener('click', e => {
  const c = e.target.closest('[data-copy]'); if (!c) return;
  const pre = c.parentElement.querySelector('pre');
  const done = () => { c.textContent = 'Copied'; setTimeout(() => { c.textContent = 'Copy prompt'; }, 1500); };
  const pick = () => { const r = document.createRange(); r.selectNodeContents(pre); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); c.textContent = 'Selected. Copy it.'; };
  try { navigator.clipboard.writeText(pre.textContent).then(done, pick); } catch (err) { pick(); }
});

/* the picker: starts on whoever ran the map, and remembers this viewer's last choice */
if (PEOPLE.length) {
  const VKEY = 'zoom-out:view:' + M.project, $ = id => document.getElementById(id);
  VIEW.who = PEOPLE.some(p => p.name === M.runBy) ? M.runBy : PEOPLE[0].name;
  try { const v = JSON.parse(localStorage.getItem(VKEY) || 'null'); if (v && (v.who === '*' || v.who === '' || PEOPLE.some(p => p.name === v.who))) Object.assign(VIEW, v); } catch (e) { /* keep the default */ }
  $('who').value = VIEW.who; $('range').value = VIEW.mode; $('from').value = VIEW.from; $('to').value = VIEW.to; $('dates').hidden = VIEW.mode !== 'custom';
  app.addEventListener('change', e => {

    $('dates').hidden = VIEW.mode !== 'custom';

}

addEventListener('hashchange', () => show(location.hash.slice(1)));
